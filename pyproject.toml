[project]
name = "japanese-study-coach"
version = "0.1.0"
description = "A Claude-powered Japanese study coach with dictionary lookup and spaced-repetition flashcards"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0"]

[project.scripts]
coach = "coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coach"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
